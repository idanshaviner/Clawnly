# Render Blueprint for deploying Clawnly as a public, demo-only web app.
# In Render: New -> Blueprint -> pick this repo. Or configure a Web Service by
# hand with the build/start commands below.
services:
  - type: web
    name: clawnly
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # app lives in src/; bind 0.0.0.0 and use the port Render provides.
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --app-dir src
    envVars:
      # public deploy runs the free offline demo only -- never spends API money.
      - key: CLAWNLY_DEMO_ONLY
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.6"
