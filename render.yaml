# Render Blueprint for deploying the Clawnly pilot.
# In Render: New -> Blueprint -> pick this repo. Or configure a Web Service by
# hand with the build/start commands below.
#
# The server holds its own real keys: residents log in, bring their agent, and
# the hub calls Claude on their behalf.
services:
  - type: web
    name: clawnly-pilot
    runtime: python
    # NOT "free" -- real resident data (accounts, the dossiers people bring,
    # agent conversations, invitations) lives in db.py's SQLite file, and
    # Render's free plan has no persistent disk (the filesystem resets on every
    # deploy/restart). The disk below only attaches to a paid instance type.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --app-dir src
    disk:
      name: clawnly-pilot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # points db.py at the persistent disk above, not the container's
      # ephemeral filesystem -- see db.py's DB_PATH / CLAWNLY_DB_PATH.
      - key: CLAWNLY_DB_PATH
        value: /var/data/clawnly.db
      # `sync: false` = Render prompts you to type the value in its dashboard
      # during setup and never stores it in this repo. Fill in all of them.
      # ANTHROPIC_API_KEY must be scoped to a workspace (create it inside one in
      # the Anthropic Console), or every call is refused.
      - key: ANTHROPIC_API_KEY
        sync: false
      # the site's public address, e.g. https://clawnly-pilot.onrender.com. Emailed
      # sign-in links and the Google redirect are built from this, never from the
      # request's Host header (which an attacker controls).
      - key: CLAWNLY_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Admin allowlist (comma-separated emails) -- see auth.is_admin /
      # config.parse_admin_emails. Fill in your own email(s).
      - key: CLAWNLY_ADMIN_EMAILS
        sync: false
