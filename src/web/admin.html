<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawnly Admin</title>
<style>
  :root {
    --bg:#f7f6f3; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e4e2dd;
    --accent:#6c5ce7; --accent-soft:#efedfd; --green:#2f9e6e; --amber:#c98a2b; --red:#b3261e;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:26px 20px 90px; }
  h1 { font-size:26px; margin:0 0 4px; letter-spacing:-.5px; }
  .tagline { color:var(--muted); margin:0 0 20px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-top:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .nb-card { cursor:pointer; }
  .nb-card:hover { border-color:var(--accent); }
  .nb-name { font-weight:700; font-size:16px; }
  .nb-slug { color:var(--muted); font-size:12px; }
  .bar-track { background:var(--accent-soft); border-radius:999px; height:8px; margin-top:10px; overflow:hidden; }
  .bar-fill { background:var(--accent); height:100%; }
  .bar-label { font-size:12.5px; color:var(--muted); margin-top:6px; }
  .status-triggered { color:var(--green); font-size:12px; font-weight:600; margin-top:4px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.4px; }
  .pill { display:inline-block; border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; }
  .pill-onboarding { background:#f1efe9; color:var(--muted); }
  .pill-complete_unmatched { background:var(--accent-soft); color:var(--accent); }
  .pill-match_pending { background:#fdf1dc; color:var(--amber); }
  .pill-match_waiting { background:#fdf1dc; color:var(--amber); }
  .pill-sealed { background:#e6f6ee; color:var(--green); }
  .pill-dissolved { background:#fbeceb; color:var(--red); }
  button { font:inherit; border-radius:10px; border:1px solid var(--line); padding:9px 14px;
    background:var(--card); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border:none; font-weight:600; }
  button:disabled { opacity:.55; cursor:default; }
  .back { color:var(--accent); cursor:pointer; font-size:13.5px; }
  .section h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:0 0 10px; }
  .err { color:var(--red); font-size:13.5px; margin-top:8px; }
  .ok { color:var(--green); font-size:13.5px; margin-top:8px; }
  .muted { color:var(--muted); }
  .errline { font-size:12.5px; color:var(--red); margin-top:2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Clawnly Admin</h1>
  <p class="tagline">Neighborhood progress, resident status, and batch runs.</p>

  <div id="not-authorized" class="card" style="display:none">
    <p>You need to be logged in as an admin to see this page.</p>
  </div>

  <div id="list-view" style="display:none">
    <div class="grid" id="nb-grid"></div>
  </div>

  <div id="detail-view" style="display:none">
    <p class="back" id="back-link">&larr; All neighborhoods</p>
    <div class="card">
      <div class="nb-name" id="detail-name"></div>
      <div class="nb-slug" id="detail-slug"></div>
      <div class="bar-track"><div class="bar-fill" id="detail-bar"></div></div>
      <div class="bar-label" id="detail-progress-label"></div>
      <div class="status-triggered" id="detail-triggered" style="display:none"></div>
      <div style="margin-top:12px">
        <button class="primary" id="trigger-btn">Trigger batch now</button>
        <span id="trigger-status"></span>
      </div>
    </div>

    <div class="card section">
      <h2>Residents</h2>
      <table>
        <thead><tr><th>Email</th><th>Name</th><th>Consent</th><th>Complete</th><th>Status</th></tr></thead>
        <tbody id="residents-body"></tbody>
      </table>
    </div>

    <div class="card section">
      <h2>Recent runs</h2>
      <table>
        <thead><tr><th>#</th><th>When</th><th>Mode</th><th>Groups</th><th>Unmatched</th><th>API calls</th></tr></thead>
        <tbody id="runs-body"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function show(id){
  ["not-authorized", "list-view", "detail-view"].forEach(function(other){
    document.getElementById(other).style.display = (other === id) ? "block" : "none";
  });
}

function statusLabel(s){
  var labels = {
    onboarding: "Onboarding", complete_unmatched: "Complete, unmatched",
    match_pending: "Match pending", match_waiting: "Waiting on group",
    sealed: "Sealed", dissolved: "Dissolved",
  };
  return labels[s] || s;
}

function loadList(){
  fetch("/api/admin/neighborhoods").then(function(r){
    if (r.status === 401 || r.status === 403) { show("not-authorized"); return null; }
    return r.json();
  }).then(function(data){
    if (data == null) { return; }
    var grid = document.getElementById("nb-grid");
    grid.innerHTML = "";
    data.neighborhoods.forEach(function(nb){
      var pct = nb.batch_threshold > 0 ? Math.min(100, Math.round(100 * nb.complete_count / nb.batch_threshold)) : 0;
      var div = document.createElement("div");
      div.className = "card nb-card";
      div.innerHTML =
        '<div class="nb-name">' + esc(nb.name) + '</div>' +
        '<div class="nb-slug">' + esc(nb.slug) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="bar-label">' + nb.complete_count + ' / ' + nb.batch_threshold + ' complete (' +
          nb.resident_count + ' registered)</div>' +
        (nb.batch_triggered_at ? '<div class="status-triggered">Batch triggered</div>' : '');
      div.addEventListener("click", function(){ loadDetail(nb.id); });
      grid.appendChild(div);
    });
    show("list-view");
  }).catch(function(){ show("not-authorized"); });
}

function loadDetail(id){
  fetch("/api/admin/neighborhoods/" + id).then(function(r){
    if (r.status === 401 || r.status === 403) { show("not-authorized"); return null; }
    return r.json();
  }).then(function(data){
    if (data == null) { return; }
    var nb = data.neighborhood;
    document.getElementById("detail-name").textContent = nb.name;
    document.getElementById("detail-slug").textContent = nb.slug;
    var pct = nb.batch_threshold > 0 ? Math.min(100, Math.round(100 * nb.complete_count / nb.batch_threshold)) : 0;
    document.getElementById("detail-bar").style.width = pct + "%";
    document.getElementById("detail-progress-label").textContent =
      nb.complete_count + " / " + nb.batch_threshold + " complete (" + nb.resident_count + " registered)";
    var triggered = document.getElementById("detail-triggered");
    if (nb.batch_triggered_at) {
      triggered.style.display = "block";
      triggered.textContent = "Batch triggered at " + nb.batch_triggered_at;
    } else {
      triggered.style.display = "none";
    }

    var rbody = document.getElementById("residents-body");
    rbody.innerHTML = "";
    data.residents.forEach(function(r){
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + esc(r.email) + "</td>" +
        "<td>" + esc(r.name || "-") + "</td>" +
        "<td>" + (r.consent_agreed_at ? "yes" : "no") + "</td>" +
        "<td>" + (r.profile_complete_at ? "yes" : "no") + "</td>" +
        '<td><span class="pill pill-' + esc(r.status) + '">' + esc(statusLabel(r.status)) + "</span></td>";
      rbody.appendChild(tr);
    });

    var runsBody = document.getElementById("runs-body");
    runsBody.innerHTML = "";
    data.runs.forEach(function(run){
      var apiCalls = run.usage ? run.usage.total : "-";
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + run.id + "</td>" +
        "<td>" + esc(run.created_at) + "</td>" +
        "<td>" + esc(run.mode) + "</td>" +
        "<td>" + run.group_count + "</td>" +
        "<td>" + run.unmatched_count + "</td>" +
        "<td>" + apiCalls + "</td>";
      runsBody.appendChild(tr);
      if (run.interview_errors && run.interview_errors.length > 0) {
        var errRow = document.createElement("tr");
        var errCell = document.createElement("td");
        errCell.colSpan = 6;
        errCell.className = "errline";
        errCell.textContent = run.interview_errors.length + " interview failure(s): " +
          run.interview_errors.map(function(e){ return e.id; }).join(", ");
        errRow.appendChild(errCell);
        runsBody.appendChild(errRow);
      }
    });

    var triggerBtn = document.getElementById("trigger-btn");
    var triggerStatus = document.getElementById("trigger-status");
    triggerStatus.textContent = "";
    triggerStatus.className = "";
    triggerBtn.onclick = function(){
      triggerBtn.disabled = true;
      triggerStatus.className = "";
      triggerStatus.textContent = "Running...";
      fetch("/api/admin/neighborhoods/" + id + "/trigger", { method: "POST" })
        .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
        .then(function(res){
          triggerBtn.disabled = false;
          if (res.ok) {
            triggerStatus.className = "ok";
            triggerStatus.textContent = "Run #" + res.data.run_id + " complete.";
            loadDetail(id);
          } else {
            triggerStatus.className = "err";
            triggerStatus.textContent = res.data.error || "Something went wrong.";
          }
        })
        .catch(function(){
          triggerBtn.disabled = false;
          triggerStatus.className = "err";
          triggerStatus.textContent = "Something went wrong. Try again.";
        });
    };

    show("detail-view");
  }).catch(function(){ show("not-authorized"); });
}

document.getElementById("back-link").addEventListener("click", loadList);

fetch("/api/me").then(function(r){
  if (!r.ok) { show("not-authorized"); return null; }
  return r.json();
}).then(function(me){
  if (me == null) { return; }
  if (me.role !== "admin") { show("not-authorized"); return; }
  loadList();
}).catch(function(){ show("not-authorized"); });
</script>
</body>
</html>
